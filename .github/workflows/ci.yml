name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-ci:
    name: Android Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Android Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Android Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Build Android Release APK (R8 & Minification Check)
        run: ./gradlew :app:assembleRelease --no-daemon

  ios-ci:
    name: iOS Test & Build
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen and Generate Project
        run: |
          which xcodegen || brew install xcodegen
          cd ios && xcodegen generate

      - name: Run iOS Unit Tests
        run: |
          DEVICE_NAME=$(xcrun simctl list devices available | grep -E "iPhone" | head -n 1 | sed -E 's/ *\([A-F0-9-]+\).*//; s/^[[:space:]]*//')
          echo "Testing against simulator: '$DEVICE_NAME'"
          xcodebuild test \
            -project ios/Curio.xcodeproj \
            -scheme Curio \
            -destination "platform=iOS Simulator,name=${DEVICE_NAME:-iPhone 16}" \
            -quiet

      - name: Build iOS Release Scheme
        run: |
          xcodebuild build \
            -project ios/Curio.xcodeproj \
            -scheme Curio \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            -quiet
